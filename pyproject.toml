[project]
name = "unified-coastal-vulnerability-index"
version = "0.1.0"
description = "Unified Physics-Informed Coastal Vulnerability Index (Upsilon) & Embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "pymc>=5.10.0",
    "arviz>=0.17.0",
    "xarray>=2023.1.0",
    "requests>=2.31.0",
    "umap-learn>=0.5.5",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "google-genai>=2.19.0",
    "pydantic>=2.10.0",
    "dotenv>=0.9.9",
    "netcdf4>=1.7.3",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
    "shap>=0.49.1",
    "bxai>=0.1.4",
    "pytz>=2026.3.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

